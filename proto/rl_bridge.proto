syntax = "proto3";

package openra.rl;

option csharp_namespace = "OpenRA.Mods.Common.RL";

// The RL Bridge service allows an external agent to interact with OpenRA.
// In multi-session mode, a single gRPC server hosts many concurrent game
// sessions, each identified by a session_id.
service RLBridge {
  // Bidirectional streaming: game sends observations, agent sends actions.
  // Each observation waits for an action before advancing to the next tick.
  rpc GameSession(stream AgentAction) returns (stream GameObservation);

  // Unary: query current game state on demand.
  rpc GetState(StateRequest) returns (GameState);

  // Unary: advance N ticks with optional commands, return observation.
  // Bypasses streaming — works reliably on all platforms.
  // Server hard-deadline (default 90s, OPENRA_RL_FAST_ADVANCE_DEADLINE_S):
  // on DEADLINE_EXCEEDED the session_id is POISONED/DESTROYED — never reuse;
  // next episode MUST CreateSession for a fresh id.
  rpc FastAdvance(FastAdvanceRequest) returns (GameObservation);

  // Unary: snapshot observation for a specific player slot (RL-vs-RL peer).
  // Call after FastAdvance; world must be idle. Empty player_slot = primary (Multi1).
  rpc GetObservation(ObservationRequest) returns (GameObservation);

  // Session management (multi-session mode)
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  // Mandatory GC after DEADLINE / client gone: purge zombies; logs active_sessions.
  rpc DestroySession(DestroySessionRequest) returns (DestroySessionResponse);
}

// ─── Observations (Game → Agent) ────────────────────────────────────────────

message GameObservation {
  int32 tick = 1;
  string episode_id = 2;

  // Structured observations
  RlEconomy economy = 3;
  RlMilitary military = 4;
  repeated RlUnitInfo units = 5;
  repeated RlBuildingInfo buildings = 6;
  repeated RlProductionInfo production = 7;
  repeated RlUnitInfo visible_enemies = 8;
  RlMapInfo map_info = 9;

  // Binary-encoded spatial tensor (terrain, unit density, fog, etc.)
  // Format: flat float32 array, row-major channels-last
  // Shape: map_info.height × map_info.width × spatial_channels
  bytes spatial_map = 10;
  int32 spatial_channels = 11;

  // Episode signals
  bool done = 12;
  float reward = 13;
  string result = 14; // "win", "lose", "draw", ""

  // Available actions context
  repeated string available_production = 15;

  // Visible enemy buildings (separate from visible_enemies which only has units)
  repeated RlBuildingInfo visible_enemy_buildings = 16;

  // Fog of war exploration progress (0-100)
  float explored_percent = 17;

  // Server-side interrupt detection results
  bool interrupted = 18;           // true if advance ended early due to interrupt
    string interrupt_reason = 19;    // signal name (e.g. "enemy_spotted")
    int32 actual_ticks_advanced = 20; // ticks actually advanced (may be < requested)

    // Resumen modo espectador por bando (evaluacion / metricas). NO debe
    // usarse para decidir: el agente sigue con su obs con niebla.
    RlGlobalSummary global_summary = 21;

    // Player slot this observation belongs to (e.g. "Multi1"). Empty = legacy primary.
    string player_slot = 22;
    // SupportPowerManager keys that are Ready (Chronoshift, NukePowerOrder, ...).
    repeated string ready_support_powers = 23;

    // v3 commander: decisions the agent must answer in the next FastAdvance
    // (brain "external"). Unanswered requests count as "wait".
    repeated DecisionRequest pending_decisions = 24;
    // Decisions taken by the built-in bot logic since the last observation
    // (brain "builtin"): the teacher signal for imitation.
    repeated TeacherDecision teacher_decisions = 25;
  }

// ─── v3 commander decisions ─────────────────────────────────────────────────

enum DecisionKind {
  DECISION_NONE = 0;
  DECIDE_BUILD = 1;   // a structure queue (Building / Defense) is free
  DECIDE_TRAIN = 2;   // a unit queue (Infantry / Vehicle / ...) is free
  DECIDE_ARMY = 3;    // periodic: where the main army goes
}

message TargetCandidate {
  int32 cell_x = 1;
  int32 cell_y = 2;
  string kind = 3;   // "enemy_spawn" | "enemy_building"
  string type = 4;   // actor type for enemy_building
}

message DecisionRequest {
  uint32 id = 1;
  DecisionKind kind = 2;
  string queue = 3;                      // BUILD/TRAIN: production queue type
  repeated string options = 4;           // BUILD/TRAIN: items buildable right now
  repeated TargetCandidate targets = 5;  // ARMY: attack candidates
  int32 tick = 6;
}

message Decision {
  uint32 request_id = 1;
  string choice = 2;        // BUILD/TRAIN: one of options; "" = wait
  // ARMY: -1 = hold (call off the attack, back home), k = attack targets[k].
  // Leaving an ARMY request unanswered keeps the current orders.
  int32 target_index = 3;
}

message TeacherDecision {
  DecisionRequest request = 1;
  Decision decision = 2;
}

  message RlGlobalSummary {
        message Side {
          int32 cash = 1;
          int32 unit_value = 2;
          int32 building_value = 3;
          int32 n_buildings = 4;   // conteo de edificios vivos del bando (para raze)
          int32 earned = 5;        // mineral extraido acumulado (PlayerResources.Earned)
        }
        Side own = 1;
        Side enemy = 2;
      }

message RlEconomy {
  int32 cash = 1;
  int32 ore = 2;
  int32 power_provided = 3;
  int32 power_drained = 4;
  int32 resource_capacity = 5;
  int32 harvester_count = 6;
}

message RlMilitary {
  int32 units_killed = 1;
  int32 units_lost = 2;
  int32 buildings_killed = 3;
  int32 buildings_lost = 4;
  int32 army_value = 5;
  int32 active_unit_count = 6;
  int32 kills_cost = 7;        // Total cost value of enemy units/buildings killed
  int32 deaths_cost = 8;       // Total cost value of own units/buildings lost
  int32 assets_value = 9;      // Total value of all assets (units + buildings)
  int32 experience = 10;       // Player experience points
  int32 order_count = 11;      // Total orders issued
}

message RlUnitInfo {
  uint32 actor_id = 1;
  string type = 2;          // e.g. "e1", "1tnk", "harv"
  int32 pos_x = 3;          // WPos X
  int32 pos_y = 4;          // WPos Y
  int32 cell_x = 5;         // CPos X (grid)
  int32 cell_y = 6;         // CPos Y (grid)
  float hp_percent = 7;     // 0.0 - 1.0
  bool is_idle = 8;
  string current_activity = 9;
  string owner = 10;        // Player internal name
  int32 ammo = 11;          // -1 if not applicable
  bool can_attack = 12;

  // Sprint 4: enriched unit data
  int32 facing = 13;           // WAngle 0-1023 (direction unit faces)
  int32 experience_level = 14; // Veterancy level (0 = none)
  int32 stance = 15;           // 0=HoldFire, 1=ReturnFire, 2=Defend, 3=AttackAnything
  int32 speed = 16;            // Current movement speed (with modifiers)
  int32 attack_range = 17;     // Max attack range in WDist units
  int32 passenger_count = 18;  // Cargo count (0 if not transport, -1 if N/A)
  bool is_building = 19;       // false for units (helps distinguish in visible_enemies)
}

message RlBuildingInfo {
  uint32 actor_id = 1;
  string type = 2;          // e.g. "powr", "barr", "weap"
  int32 pos_x = 3;
  int32 pos_y = 4;
  float hp_percent = 5;
  string owner = 6;
  bool is_producing = 7;
  float production_progress = 8; // 0.0 - 1.0 if producing
  string producing_item = 9;
  bool is_powered = 10;

  // Sprint 4: enriched building data
  bool is_repairing = 11;          // Actively being repaired
  int32 sell_value = 12;           // Refund amount if sold
  int32 rally_x = 13;             // Rally point cell X (-1 if none)
  int32 rally_y = 14;             // Rally point cell Y (-1 if none)
  int32 power_amount = 15;        // Power provided (positive) or consumed (negative)
  repeated string can_produce = 16; // Items this building can produce
  int32 cell_x = 17;              // Cell position X
  int32 cell_y = 18;              // Cell position Y
}

message RlProductionInfo {
  string queue_type = 1;    // "Building", "Infantry", "Vehicle", "Aircraft"
  string item = 2;          // Actor type being produced
  float progress = 3;       // 0.0 - 1.0
  int32 remaining_ticks = 4;
  int32 remaining_cost = 5;
  bool paused = 6;
}

message RlMapInfo {
  int32 width = 1;          // Map width in cells
  int32 height = 2;         // Map height in cells
  string map_name = 3;
}

// ─── Actions (Agent → Game) ──────────────────────────────────────────────────

message AgentAction {
  repeated Command commands = 1;
}

message Command {
  ActionType action = 1;
  uint32 actor_id = 2;        // Subject actor (for unit commands)
  uint32 target_actor_id = 3; // Target actor (for attack, enter, etc.)
  int32 target_x = 4;         // Target CPos X (for move, deploy, etc.)
  int32 target_y = 5;         // Target CPos Y
  string item_type = 6;       // For build/train: actor type to produce
  bool queued = 7;             // Queue after current activity vs interrupt
  int32 ticks = 8;             // For FAST_ADVANCE: number of ticks to fast-forward
}

enum ActionType {
  NO_OP = 0;
  MOVE = 1;
  ATTACK_MOVE = 2;
  ATTACK = 3;
  STOP = 4;
  HARVEST = 5;
  BUILD = 6;         // Start production of a building
  TRAIN = 7;         // Start production of a unit
  DEPLOY = 8;        // Deploy MCV, unpack
  SELL = 9;          // Sell building
  REPAIR = 10;       // Repair building
  PLACE_BUILDING = 11; // Place a completed building at target location
  CANCEL_PRODUCTION = 12;
  SET_RALLY_POINT = 13;
  GUARD = 14;           // Guard another actor (target_actor_id)
  SET_STANCE = 15;      // Set unit stance (target_x: 0=HoldFire, 1=ReturnFire, 2=Defend, 3=AttackAnything)
  ENTER_TRANSPORT = 16; // Load into transport (target_actor_id)
  UNLOAD = 17;          // Unload all passengers at current location
  POWER_DOWN = 18;      // Toggle building power on/off (actor_id = building)
  SET_PRIMARY = 19;     // Set primary production building (actor_id = building)
  SURRENDER = 20;       // Surrender / resign — ends the game as a loss
  FAST_ADVANCE = 21;
  PATROL = 22;          // Patrol between current position and target
  ARMY_ATTACK_MOVE = 23;
  SUPPORT_POWER = 24;   // Fire a ready support power (item_type = OrderName)
}

// ─── State Query ─────────────────────────────────────────────────────────────

message GameState {
  string episode_id = 1;
  int32 tick = 2;
  string phase = 3;           // "waiting", "playing", "game_over"
  string winner = 4;          // Player internal name, empty if ongoing
  int32 player_count = 5;
  string player_faction = 6;  // Player faction internal name (e.g. "england", "ukraine")
  string enemy_faction = 7;   // Opponent faction internal name (if known)
}

message StateRequest {
  string session_id = 1;  // Route to specific session (multi-session mode)
}

message ObservationRequest {
  string session_id = 1;
  string player_slot = 2;  // e.g. "Multi0" / "Multi1"; empty = primary
}

// ─── Fast Advance (Unary) ───────────────────────────────────────────────────

message FastAdvanceRequest {
  int32 ticks = 1;
  repeated Command commands = 2;
  string session_id = 3;  // Route to specific session (multi-session mode)

  // Server-side interrupt detection: check for events every N ticks during
  // the advance. If an interrupt fires, advance ends early with interrupted=true.
  // 0 = disabled (legacy behavior: advance full ticks, no interrupt checks).
  int32 check_events_every = 4;
  repeated string enabled_interrupts = 5;  // Signal names: "enemy_spotted", "building_discovered", etc.

  // RL-vs-RL: inject these commands into peer_slot's ExternalBotBridge before
  // ticking (no second FastAdvance). Empty peer_commands = bot/scripted Multi0.
  repeated Command peer_commands = 6;
  string peer_slot = 7;  // default "Multi0" when peer_commands non-empty

  // v3 commander: answers to the previous observation's pending_decisions.
  // With brain "external" the advance also stops early when new decisions arise.
  repeated Decision decisions = 8;
}

// ─── Session Management (Multi-Session Mode) ────────────────────────────────

message CreateSessionRequest {
  string map_name = 1;    // Map filename or UID
  string bots = 2;        // Bot config: "Multi1:rl-agent,Multi0:beginner"
  int32 seed = 3;         // Random seed (0 = random)
  // Empty → C# default RandomAllies on the rl-agent slot (doc 24).
  // Valid: RandomAllies, england, france, germany (not Random: rewritten).
  string player_faction = 4;
  // Empty → Random for scripted/other slots.
  string enemy_faction = 5;
  // v3 commander brain for the rl-agent slot: "external" (agent decides,
  // default) or "builtin" (the normal bot logic decides and reports teacher_decisions).
  string agent_brain = 6;
}

message CreateSessionResponse {
  string session_id = 1;
}

message DestroySessionRequest {
  string session_id = 1;
}

message DestroySessionResponse {}
