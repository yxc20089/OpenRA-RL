# Six RL daemons on :9999-:10004, one worker each.
#
# Use ONE session per daemon: concurrent sessions in the same process share
# engine state and stop being reproducible (docs/v3-phase0-results.md).
# Throughput scales with daemons (~6k ticks/s each on a 5600X).
#
#   docker compose up -d --build
#   python -m ra_env.bench --daemons localhost:9999,localhost:10000,...  --sessions 1

x-daemon: &daemon
  image: openra-rl:v3
  build:
    context: .
  environment:
    - OPENRA_RL_WORKERS=1
  deploy:
    resources:
      limits:
        cpus: "1.5"
        memory: 2G
  restart: unless-stopped

services:
  daemon-1:
    <<: *daemon
    ports: ["9999:9999"]
  daemon-2:
    <<: *daemon
    ports: ["10000:9999"]
  daemon-3:
    <<: *daemon
    ports: ["10001:9999"]
  daemon-4:
    <<: *daemon
    ports: ["10002:9999"]
  daemon-5:
    <<: *daemon
    ports: ["10003:9999"]
  daemon-6:
    <<: *daemon
    ports: ["10004:9999"]
