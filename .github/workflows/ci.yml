name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Proto stubs up to date
        run: |
          python scripts/gen_proto.py
          git diff --exit-code ra_env/_proto

      - name: Unit tests
        run: pytest

      - name: Lint
        run: ruff check ra_env ra_rl tests scripts
