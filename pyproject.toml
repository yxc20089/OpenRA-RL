[project]
name = "openra-rl"
version = "3.0.0.dev0"
description = "Reinforcement learning agent for OpenRA Red Alert (Allies), v3"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.11"
dependencies = [
    # Must be >= the versions that generated ra_env/_proto (scripts/gen_proto.py).
    "grpcio>=1.85.0",
    "protobuf>=7.35.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    # Pinned: CI regenerates ra_env/_proto and fails on any diff.
    "grpcio-tools==1.85.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
# Training and network policies. For CUDA wheels:
#   pip install torch --index-url https://download.pytorch.org/whl/cu126
train = [
    "torch>=2.4",
    "tensorboard>=2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ra_env", "ra_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["daemon: needs a running OpenRA daemon (docker compose up -d)"]
addopts = "-m 'not daemon'"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["ra_env/_proto", "OpenRA"]
